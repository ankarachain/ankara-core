[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/compliance/compliance-policy",
    "contracts/compliance/reserve-attestation",
    "contracts/templates/farmland-token",
    "contracts/templates/commodity-receipt-token",
    "contracts/templates/real-estate-token",
    "contracts/templates/invoice-token",
    "contracts/templates/carbon-credit-token",
    "contracts/templates/mining-rights-token",
    "contracts/templates/farmland-nft",
    "contracts/templates/real-estate-nft",
    "contracts/templates/mining-rights-nft",
    "contracts/templates/commodity-vault-nft",
    "contracts/templates/commodity-batch-token",
    "contracts/distribution/revenue-distributor",
    "contracts/markets/rfq-market",
    "contracts/templates/pool-vault",
    "contracts/oracle/manual-oracle",
    "contracts/identity/whitelist-verifier",
    "contracts/identity/attestation-registry",
    "contracts/collateral-vault",
    "contracts/oracle/sep40-oracle-adapter",
    "contracts/factory/token-factory",
    "contracts/factory/nft-factory",
    "contracts/factory/multi-token-factory",
    "contracts/escrow/milestone-escrow",
    "contracts/payments/payment-stream",
    "contracts/payments/batch-disburser",
    "contracts/factory/escrow-factory",
    "contracts/ramp/ramp-settlement",
    "contracts/lending/manual-credit-scorer",
    "contracts/lending/savings-circle",
    "contracts/factory/ramp-settlement-factory",
    "contracts/factory/ankara-factory-registry",
]

[workspace.dependencies]
soroban-sdk = "26.1.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
