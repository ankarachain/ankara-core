[package]
name = "pool-vault"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
ankara-common = { path = "../../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
manual-oracle = { path = "../../oracle/manual-oracle" }
farmland-token = { path = "../farmland-token" }
